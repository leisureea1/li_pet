name: Build and Package App

on:
  push:
    
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            separator: ';'
          - os: macos-14
            name: macOS-AppleSilicon
            separator: ':'
          - os: macos-15-intel
            name: macOS-Intel
            separator: ':'
            
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Download Vosk Model
        run: python scripts/download_vosk.py
        
      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --name "pet" --windowed \
            --collect-all onnxruntime \
            --collect-all tokenizers \
            --add-data "character_fullbody.png${{ matrix.separator }}." \
            --add-data "pat_hand_nobg.png${{ matrix.separator }}." \
            --add-data "screen.png${{ matrix.separator }}." \
            --add-data "models/vosk-model${{ matrix.separator }}models/vosk-model" \
            pet.py --clean
            
      - name: Set up NSIS (Windows only)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          
      - name: Build Installer with NSIS (Windows only)
        if: runner.os == 'Windows'
        run: |
          makensis installer.nsi
          
      - name: Package DMG (macOS only)
        if: runner.os == 'macOS'
        run: |
          # Create DMG bundle from the PyInstaller .app
          hdiutil create -volname "LiTongtongPet" -srcfolder dist/pet.app -ov -format UDZO LiTongtong_Setup_${{ matrix.name }}.dmg
          
      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LiTongtong_Setup_${{ matrix.name }}
          path: LiTongtong_Setup.exe
          
      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LiTongtong_Setup_${{ matrix.name }}
          path: LiTongtong_Setup_${{ matrix.name }}.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
