name: Build and Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --hidden-import edge_tts --hidden-import pygame --add-data "character_fullbody.png;." --add-data "pat_hand_nobg.png;." pet.py

      - name: Install NSIS
        run: choco install nsis

      - name: Build Installer with NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /INPUTCHARSET UTF8 installer.nsi

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: LiTongtong-Windows-Setup
          path: LiTongtong_Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --windowed --hidden-import edge_tts --hidden-import pygame --add-data "character_fullbody.png:." --add-data "pat_hand_nobg.png:." pet.py

      - name: Zip Mac App
        run: |
          cd dist
          zip -r LiTongtong-Mac.zip pet.app

      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: LiTongtong-Mac-App
          path: dist/LiTongtong-Mac.zip
