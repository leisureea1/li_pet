name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --noconsole --onefile `
            --hidden-import edge_tts `
            --hidden-import pygame `
            --hidden-import pkg_resources.py2_warn `
            --hidden-import pycaw `
            --hidden-import comtypes `
            --add-data "character_fullbody.png;." `
            --add-data "pat_hand_nobg.png;." `
            --add-data "skills;skills" `
            --add-data "skills.json;." `
            pet.py

      - name: Install NSIS
        run: choco install nsis -y

      - name: Convert installer.nsi to UTF-16 LE BOM
        shell: powershell
        run: |
          $content = Get-Content -Path "installer.nsi" -Raw -Encoding UTF8
          $enc = New-Object System.Text.UnicodeEncoding($false, $true)
          [System.IO.File]::WriteAllText("installer.nsi", $content, $enc)

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: LiTongtong_Setup.exe

  build-macos-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --noconsole --onefile \
            --hidden-import edge_tts \
            --hidden-import pygame \
            --hidden-import pkg_resources.py2_warn \
            --add-data "character_fullbody.png:." \
            --add-data "pat_hand_nobg.png:." \
            --add-data "skills:skills" \
            --add-data "skills.json:." \
            pet.py

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp dist/pet dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "LiTongtongPet" -srcfolder dmg_temp -ov -format UDZO LiTongtong-Apple.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-installer
          path: LiTongtong-Apple.dmg

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --noconsole --onefile \
            --hidden-import edge_tts \
            --hidden-import pygame \
            --hidden-import pkg_resources.py2_warn \
            --add-data "character_fullbody.png:." \
            --add-data "pat_hand_nobg.png:." \
            --add-data "skills:skills" \
            --add-data "skills.json:." \
            pet.py

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp dist/pet dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "LiTongtongPet" -srcfolder dmg_temp -ov -format UDZO LiTongtong-Intel.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-installer
          path: LiTongtong-Intel.dmg

  release:
    needs: [build-windows, build-macos-apple, build-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Download macOS Apple artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-apple-installer
          path: artifacts

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-installer
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == '' && 'latest' || github.ref_name }}
          name: Release ${{ github.ref_name == '' && 'latest' || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/LiTongtong_Setup.exe
            artifacts/LiTongtong-Apple.dmg
            artifacts/LiTongtong-Intel.dmg
